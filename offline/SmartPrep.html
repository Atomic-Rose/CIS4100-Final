:root {
  color-scheme: light;
  /* Memory Map: warm paper, near-black ink, one ultramarine. Green and red are reserved for answer feedback. */
  --paper: #f3f1ec;
  --sheet: #fbfaf7;
  --ink: #14161a;
  --quiet: #575b63;
  --rule: #dcd8cf;
  --rule-strong: #aaa598;
  --accent: #2a3bd6;
  --accent-hover: #1f2db0;
  --accent-tint: #e6e8fa;
  --correct: #17683f;
  --correct-tint: #e2f0e6;
  --wrong: #a3261c;
  --wrong-tint: #f8e5e2;
  --cell-review: #c2412f;
  --warn-tint: #f6e7c8;
  --warn-line: #a8691a;
  --radius: 6px;
  --font: "Geist", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --mono: "Geist Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
  --bar: 76px;
}
</style><style>*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:1rem/1.55 var(--font);font-feature-settings:"ss01";min-height:100vh}
button,input,select{font:inherit;color:inherit}button,summary{cursor:pointer}button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}h1:focus,.feedback:focus{outline:none}
h1,h2,h3,p,figure{margin:0}h1,h2,h3{line-height:1.15;letter-spacing:-.025em;font-weight:600}
/* A datasheet frame: hairlines at the edges of the content column on wide screens. */
main{width:min(1120px,calc(100% - 32px));margin-inline:auto;min-height:100vh}
@media(min-width:1000px){main{border-inline:1px solid var(--rule);padding-inline:40px;width:min(1200px,calc(100% - 64px))}}
.eyebrow{font:500 .75rem/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--quiet)}
.lede{margin-top:14px;color:var(--quiet);font-size:1.0625rem}
.muted{color:var(--quiet);font-size:.875rem}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:24px}

/* Buttons */
.button{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 18px;border:1px solid transparent;border-radius:var(--radius);background:transparent;font-weight:600;line-height:1.3;text-align:center;transition:background-color 120ms ease,border-color 120ms ease,color 120ms ease}
.primary{background:var(--accent);color:#fff}.primary:hover:not(:disabled){background:var(--accent-hover)}.primary:disabled{background:var(--rule);color:var(--quiet)}
.outline{border-color:var(--rule-strong);background:var(--sheet)}.outline:hover{border-color:var(--ink)}
.text{padding-inline:10px;color:var(--ink)}.text:hover{background:rgb(20 22 26/.06)}
.link{min-height:0;padding:0;border:0;font-weight:500;text-decoration:underline;text-underline-offset:3px;color:var(--ink)}
.small{min-height:36px;padding:6px 12px;font-size:.875rem}

/* Banner and notices */
.storage-warning{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:12px max(16px,calc((100vw - 1120px)/2));background:var(--warn-tint);border-bottom:1px solid var(--warn-line);font-size:.9375rem}
.storage-warning[hidden],#notice[hidden]{display:none}
.banner-actions{display:flex;gap:4px}
#notice{padding:10px max(16px,calc((100vw - 1120px)/2));background:var(--sheet);border-bottom:1px solid var(--rule);font-size:.9375rem}
.skip-link{position:absolute;top:-100px;left:12px;z-index:9;background:var(--sheet);padding:12px}.skip-link:focus{top:8px}

/* Memory map */
.map ol,ol.map{list-style:none;margin:0;padding:0}
.map-row,.row-button{display:grid;grid-template-columns:52px minmax(150px,220px) minmax(0,1fr);align-items:center;gap:6px 16px;width:100%;padding:14px 0;border-bottom:1px solid var(--rule);text-align:left}
.map ol .map-row:first-child,ol.map>.map-row:first-child{border-top:1px solid var(--rule)}
.addr{font:500 .8125rem var(--mono);color:var(--quiet)}
.row-main strong{display:block;font-weight:600;font-size:.9688rem;line-height:1.3}.row-main small{display:block;font-size:.8125rem;color:var(--quiet);margin-top:2px}
.cells{display:flex;flex-wrap:wrap;gap:4px;align-content:center}
.cell-group{display:flex;flex-wrap:wrap;gap:3px;margin-right:7px}
.cell{position:relative;display:inline-block;width:11px;height:11px;border-radius:2px;border:1px solid var(--rule-strong);background:transparent;transition:background-color 200ms ease,border-color 200ms ease}
.c-correct{background:var(--ink);border-color:var(--ink)}
.c-review{background:var(--cell-review);border-color:var(--cell-review)}
.cell.flagged::after{content:"";position:absolute;top:-4px;right:-4px;width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 1.5px var(--paper)}
.cell.changed{outline:2px solid var(--accent);outline-offset:1px;animation:cell-changed 600ms ease-out 1}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:14px;font:500 .75rem var(--mono);color:var(--quiet)}
.legend span{display:inline-flex;align-items:center;gap:7px}.legend .cell{transition:none}

/* Welcome */
.welcome{display:grid;gap:40px;padding-block:clamp(40px,10vh,112px) 56px;align-items:center;min-height:calc(100vh - 2px)}
.welcome h1{margin-top:18px;font-size:clamp(2.7rem,6.4vw,4.75rem);line-height:.98;letter-spacing:-.045em}
.welcome .actions{margin-top:30px}
.welcome .primary{min-height:52px;padding-inline:26px;font-size:1.0625rem}
.resume-note{margin-top:14px;font-size:.875rem;color:var(--quiet)}
.welcome-map figcaption{margin-top:2px}
@media(min-width:900px){.welcome{grid-template-columns:5fr 7fr;gap:64px}}
.welcome-map .map-row{animation:row-in 300ms cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--row)*40ms)}
.welcome-map .cell{animation:cell-in 260ms ease-out both;animation-delay:calc(var(--row)*40ms + 100ms)}

/* Hub */
.hub,.settings,.results{padding-block:28px 64px}
.hub-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--rule)}
.hub h1,.settings h1,.results h1{margin-top:28px;font-size:clamp(1.9rem,4vw,2.6rem);letter-spacing:-.035em}
.hub .actions{margin-bottom:28px}.text-actions{display:flex;flex-wrap:wrap;gap:4px}
.hub-map{border-top:1px solid var(--ink)}
.chapter-row{border-bottom:1px solid var(--rule)}
.row-button{grid-template-columns:52px minmax(150px,220px) minmax(0,1fr) 24px;border:0;background:transparent;padding-inline:0;min-height:72px}
.row-button:hover{background:rgb(20 22 26/.03)}
.chev{justify-self:end;width:10px;height:10px;border-right:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);transform:rotate(45deg) translateY(-3px);transition:transform 160ms ease}
.open .chev{transform:rotate(-135deg) translateX(-3px)}
.chapter-panel{padding:4px 0 20px 68px}
.panel-actions{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}
.topics{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.topic{display:grid;grid-template-columns:minmax(140px,240px) minmax(0,1fr) auto;align-items:center;gap:8px 16px;padding:10px 0;border-bottom:1px solid var(--rule)}
.topic-main strong{display:block;font-weight:600;font-size:.9375rem}.topic-main small{display:block;color:var(--quiet);font-size:.8125rem}

/* Settings */
.settings>.button{margin-left:-10px}.settings .eyebrow{margin-top:20px}.settings h1{margin-top:10px}
.panel{margin-top:32px;padding-top:18px;border-top:1px solid var(--rule)}
.panel h2{font:500 .8125rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--quiet);margin-bottom:12px}
.panel h3{font-size:.9375rem;margin-top:22px}
.save-state{padding-left:12px;border-left:2px solid var(--correct)}.save-warn{border-color:var(--warn-line)}
.plain-list{list-style:none;padding:0;margin:8px 0 0}.plain-list li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--rule)}.plain-list small{display:block;color:var(--quiet)}
.options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
label{display:flex;flex-direction:column;gap:6px;font-size:.875rem;font-weight:600}
select{min-height:44px;padding:8px 10px;border:1px solid var(--rule-strong);border-radius:var(--radius);background:var(--sheet)}
.file-label{margin-top:18px}input{max-width:100%}

/* Question */
.lesson{max-width:780px;margin-inline:auto;padding-bottom:24px}
.lesson-rail{position:sticky;top:0;z-index:3;display:grid;grid-template-columns:auto minmax(40px,1fr) auto auto;align-items:center;gap:14px;padding:8px 0;background:var(--paper);border-bottom:1px solid var(--rule)}
.lesson-rail .text{padding-inline:6px}
.count{font:500 .8125rem var(--mono);color:var(--quiet);white-space:nowrap}
.strip{list-style:none;margin:0;padding:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px}
.strip li{height:6px;border-radius:1px;background:var(--rule);transition:background-color 200ms ease}
.strip .ok{background:var(--correct)}.strip .bad{background:var(--cell-review)}.strip .saved{background:var(--ink)}
.strip .skip{background:repeating-linear-gradient(90deg,var(--rule-strong) 0 2px,transparent 2px 4px)}
.strip .current{box-shadow:0 0 0 1.5px var(--accent)}
.strip .flagged{border-top:2px solid var(--accent);height:8px}
.follow-note{margin-top:16px;padding:10px 12px;background:var(--accent-tint);border-left:2px solid var(--accent);font-size:.875rem}
.lesson-body{padding-top:24px}
.address{display:flex;justify-content:space-between;gap:12px;font:500 .8125rem var(--mono);color:var(--quiet);margin-bottom:14px}
.lesson h1{font-size:clamp(1.35rem,3.2vw,1.75rem);line-height:1.3;letter-spacing:-.02em}
.choices{list-style:none;margin:26px 0 0;padding:0;border-top:1px solid var(--rule)}
.choices li{border-bottom:1px solid var(--rule);transition:background-color 160ms ease}
.choices li.is-correct{background:var(--correct-tint)}.choices li.is-wrong{background:var(--wrong-tint)}
.choice{position:relative;display:grid;grid-template-columns:30px minmax(0,1fr);gap:14px;align-items:center;width:100%;min-height:72px;padding:24px 12px 14px;border:0;background:transparent;text-align:left;line-height:1.45;overflow-wrap:anywhere}
.choice:hover:not(:disabled){background:var(--sheet)}
.choice[aria-pressed="true"]{background:var(--accent-tint)}
.is-correct .choice,.is-wrong .choice{background:transparent}
.choice:disabled{color:inherit}
.choice-key{width:28px;height:28px;display:grid;place-items:center;border:1px solid var(--rule-strong);border-radius:4px;font:500 .8125rem var(--mono);background:var(--sheet)}
.choice[aria-pressed="true"] .choice-key{border-color:var(--accent);color:var(--accent)}
.is-correct .choice .choice-key{border-color:var(--correct);color:var(--correct)}.is-wrong .choice .choice-key{border-color:var(--wrong);color:var(--wrong)}
.answer-status{position:absolute;left:56px;top:5px;font:600 .75rem var(--mono);letter-spacing:.02em}
.is-correct .answer-status{color:var(--correct)}.is-wrong .answer-status{color:var(--wrong)}
.why-not{margin:-4px 0 0;padding:0 12px 16px 56px;color:var(--wrong);font-size:.9375rem;line-height:1.5}
.feedback{margin-top:20px;padding:4px 0 4px 16px;border-left:2px solid var(--ink)}
.verdict{font-size:1rem}.verdict strong{font-weight:650}
.why{margin-top:10px}
.why summary{display:inline-flex;align-items:center;min-height:36px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.why p{margin-top:8px;white-space:pre-line}.why small{display:block;margin-top:10px;font:500 .75rem var(--mono);color:var(--quiet)}
.no-similar{margin-top:10px}
/* The action bar sits over the page bottom; the lesson reserves its height so nothing ends up hidden under it. */
.lesson-actions{position:sticky;bottom:0;z-index:2;display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px;min-height:var(--bar);padding:14px 0 calc(14px + env(safe-area-inset-bottom));margin-top:20px;background:var(--paper);border-top:1px solid var(--rule)}
.lesson-foot{margin-top:8px;text-align:right}
.navigator{margin-top:20px;border-top:1px solid var(--rule);padding-top:12px}.navigator summary{font-weight:600}
.question-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px;margin-top:12px}
.nav-question{min-height:52px;border:1px solid var(--rule);border-radius:4px;background:var(--sheet);padding:6px;font:500 .875rem var(--mono)}
.nav-question small{display:block;font:400 .6875rem var(--font);color:var(--quiet)}.nav-question.current{outline:2px solid var(--accent);outline-offset:1px}
.lesson.enter .lesson-body{animation:q-in 160ms ease-out}

/* Results */
.score-line{display:flex;flex-wrap:wrap;align-items:center;gap:16px 28px;margin-top:22px}
.score{font:600 3.75rem/1 var(--font);letter-spacing:-.05em}.score span{font-size:1.6rem;color:var(--quiet);letter-spacing:-.02em}
.strip.big{flex:1 1 220px;max-width:420px}.strip.big li{height:12px}
.next-step{margin-top:32px;padding-top:22px;border-top:1px solid var(--ink)}
.next-step h2{margin-top:8px;font-size:1.5rem}.next-step p{margin-top:8px}
.results-map{margin-top:36px}.results-map h2{font:500 .8125rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--quiet);margin-bottom:10px}
.results details{margin-top:28px;border-top:1px solid var(--rule);padding-top:14px}.results summary{font-weight:600}
.answer-review{list-style:none;padding:0;margin:8px 0 0}.answer-review li{padding:16px 0;border-bottom:1px solid var(--rule)}.answer-review p+p{margin-top:6px}.answer-review small{display:block;margin-top:8px;color:var(--quiet);font-size:.8125rem}
.answer-review .why-not{padding:0;margin-top:6px}

dialog{width:min(460px,calc(100% - 32px));padding:24px;border:1px solid var(--ink);border-radius:8px;background:var(--sheet)}dialog p{margin-top:10px}dialog::backdrop{background:rgb(20 22 26/.45)}
dialog .lesson-actions{position:static;min-height:0;padding:0;border:0;background:none;margin-top:20px}

@keyframes row-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes cell-in{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@keyframes cell-changed{0%{transform:scale(1.5)}100%{transform:none}}
@keyframes q-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

@media(max-width:720px){
  .map-row,.row-button{grid-template-columns:40px minmax(0,1fr);gap:8px 10px}
  .row-button{grid-template-columns:40px minmax(0,1fr) 20px}
  .map-row .cells,.row-button .cells{grid-column:2/-1}
  .row-button .chev{grid-row:1;grid-column:3}
  .row-button .cells{grid-column:2/3}
  .cell{width:9px;height:9px}.cell-group{gap:2px;margin-right:5px}.cells{gap:3px}
  .chapter-panel{padding-left:0}
  .topic{grid-template-columns:minmax(0,1fr) auto}.topic .cells{grid-column:1/-1;grid-row:2}
  .options{grid-template-columns:1fr}
  .welcome{padding-top:32px;min-height:0;gap:36px}
  .lesson-rail{gap:8px}.lesson-rail .flag-button{padding-inline:4px}
  .choice{padding-inline:6px;gap:12px}.answer-status{left:48px}.why-not{padding-left:48px}
  .lesson-actions .button{padding-inline:12px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

__modules["src/data/questions-expanded.js"] = (() => {
// Original scenarios derived from the supplied course materials. Locators are chapter-local.
const rows = [];
function add(id, topic, prompt, choices, answer, explanation, reference) {

add('C7-009','CPU components','Which pairing matches the LMC analogy?', ['ALU: calculator; CU: little man','ALU: mailbox; CU: calculator','ALU: counter; CU: mailbox','ALU: little man; CU: calculator'],0,'The ALU calculates and compares. The CU directs transfers and the instruction cycle, like the little man directing work.','Slides 4, 6 · Assignment 7.1');
add('C7-010','Registers','A register is normally measured in megabytes because it holds an entire program.',null,false,'A register is a small fixed-width CPU storage location, measured in bits or bytes. Main memory holds the program.','Slides 7–9 · Assignment 7.2');

add('C8-015','Clock timing','A 3 GHz clock guarantees that every program completes 3 billion instructions per second.',null,false,'Clock cycles and completed instructions differ. Instructions may need several cycles or overlap, and stalls affect throughput.','Slide 5 · Assignment 8 Q12');
add('C8-016','Pipelining','An ideal 5-stage pipeline processes 8 instructions, one stage per cycle, with no stalls. How many cycles from first entry to last completion?',['8','12','13','40'],1,'Fill takes 5 cycles. The remaining 7 instructions finish one per cycle, so 5 + 8 − 1 = 12 cycles. Sequential execution would take 40.','Slides 9–10 · idealized derived example');
add('C8-017','Superscalar execution','ADD R1,R2,R3 is followed by ADD R4,R1,R5. Why can the second instruction need to wait?',['It reads the first instruction’s result','It has a different destination','It is a memory write','It changes the clock frequency'],0,'The second ADD needs the newly computed R1. This is a data dependency, so simultaneous independent execution is unsafe without handling it.','Slide 15 · Assignment 8 Q30');
add('C8-018','Superscalar execution','Independent instructions can finish out of program order in a processor with different execution units.',null,true,'Different operations have different execution times. The processor must still preserve the architectural results required by the program.','Slides 12–15 · Assignment 8 Q10');
add('C8-019','Pipelining','What information supports the chapter’s branch prediction technique?',['Past outcomes stored in a branch history table','Disk platter count','The display resolution','The capacity of a USB hub'],0,'A branch history table records earlier branch behavior to help predict a future path. A prediction can still be wrong.','Slides 11, 15 · Assignment 8 Q16');
add('C8-020','Superscalar execution','Register renaming removes every true data dependency between instructions.',null,false,'Renaming helps with conflicts involving reused register names. A consumer still needs a producer’s actual result.','Slide 15');
add('C8-021','Memory interleaving','What distinguishes a wider memory path from memory interleaving?',['Wider paths transfer more bytes together; interleaving spreads accesses across banks','Wider paths replace RAM with disk; interleaving changes opcodes','They both mean adding CPU cores','Interleaving eliminates every memory delay'],0,'Bus width increases bytes per transfer. Independent banks can overlap operations, improving memory throughput by another mechanism.','Slides 16–17 · Assignment 8 Q19');
add('C8-022','Caches','Sequentially scanning neighboring elements of an array benefits from spatial locality.',null,true,'A cache line brings nearby addresses together, so later adjacent element accesses can use the fetched block.','Slides 18, 21 · Assignment 8 Q21–22');
add('C8-023','Caches','A cache serves 920 of 1,000 requests. What is the hit ratio?',['8%','90%','92%','108.7%'],2,'Hit ratio = hits / requests = 920 / 1,000 = 0.92, or 92%. The other 80 requests are misses.','Slide 18 · independently derived');
add('C8-024','Caches','A lookup always costs 2 ns; on a miss there is an additional 50 ns penalty. With a 90% hit rate, what is average access time?',['5 ns','7 ns','45 ns','52 ns'],1,'Average = 2 ns + (1 − 0.90) × 50 ns = 7 ns. The penalty is additional, so the lookup cost applies on misses too.','Slides 18–22 · derived cache timing, assumptions stated');
add('C8-025','Caches','Cache tags tell the controller which memory blocks are currently represented.',null,true,'Tags identify cached memory blocks so the controller can determine hits and misses.','Slide 18 · Assignment 8 Q31');
add('C8-026','Caches','A dirty line in a write-back cache may differ from main memory until it is written back.',null,true,'Write-back delays propagation of modified data. Write-through forwards changes when writes occur.','Slide 18 · Assignment 8 Q33');
add('C8-027','Caches','L1 and L2 caches must have identical capacities and access times.',null,false,'Cache levels trade capacity against access speed. A small fast level can sit near the CPU with a larger slower level below it.','Slide 22');
add('C8-028','Multiprocessing','Which configuration makes one CPU responsible for scheduling work on replica CPUs?',['SIMD only','Primary-replica','Symmetric multiprocessing','Cache interleaving'],1,'The primary manages scheduling and resources. That simplicity also makes the primary a potential bottleneck and failure point.','Slides 25, 27');
add('C8-029','Multiprocessing','In SMP, processors have equal access to system resources, though they can contend for those resources.',null,true,'Equal access does not mean unlimited bandwidth. Shared memory and I/O can still become bottlenecks.','Slides 25, 28 · Assignment 8 Q25');
add('C8-030','Multiprocessing','What makes a multicore processor different from several separate processor packages?',['Several processing cores share one integrated circuit','It has no registers','It requires sequential I/O only','It cannot run multiple threads'],0,'Multicore places multiple cores on one chip. Parallel execution still depends on suitable work and available resources.','Slide 24');
add('C8-031','Multiprocessing','The chapter’s primary-replica design keeps running normally if its only primary CPU fails.',null,false,'The primary controls resources and scheduling. Its failure is a reliability problem in that design.','Slide 27');
add('C8-032','Multiprocessing','What limits performance when extra cores compete for the same memory bus?',['Resource contention','A larger opcode set necessarily','A change from binary to decimal','A loss of all locality'],0,'Multiple cores can require the same limited resource. Coordination overhead and contention reduce gains from adding processors.','Slide 28 · Assignment 8 Q35');

add('C9-009','I/O interfaces','Why put an interface between a fast CPU and a slower device?',['To adapt timing, formats, and control requirements','To make all devices identical in speed','To remove all device addressing','To make all transfers privileged arithmetic'],0,'Interfaces adapt differing device formats, speeds, bursts, and control needs without tying up the CPU for each physical detail.','Slides 4–5');
add('C9-010','Programmed I/O','Programmed I/O transfers in the chapter require a CPU instruction cycle for each word.',null,true,'One word is transferred per I/O instruction in this model. This can be adequate for slow devices but expensive for large blocks.','Slide 10 · Assignment 9 Q24');
add('C9-011','Interrupts','Which sequence best describes servicing an interrupt?',['Save context, run handler, restore context and resume','Erase memory, run handler, restart all programs','Run handler, then decide whether to save registers','Change every pending request to low priority'],0,'Saving registers and control state lets execution continue correctly after the handler. Context can be kept in a PCB or stack.','Slides 14, 17 · Assignment 9 Q14, Q25');
add('C9-012','Interrupts','An interrupt handler can freely destroy the interrupted program’s registers because it will never resume.',null,false,'The saved context preserves the program’s state so the system can restore it and resume.','Slides 14, 17');
add('C9-013','Interrupts','A shared interrupt line is asserted. The handler checks devices to locate the requester. Which technique is used?',['Polled interrupts','Busy-wait polling before any event','DMA data copying by the CPU','Instruction pipelining'],0,'Polled interrupt handling starts with an interrupt, then polls to identify its source. Busy-wait polling repeatedly checks readiness without waiting for an interrupt.','Slides 21–23');
add('C9-014','Interrupts','In the chapter’s simple instruction-cycle diagram, when are interrupts checked?',['After every individual bus bit','After an instruction executes, when enabled','Only after program termination','Only when the accumulator is zero'],1,'The diagram places the enabled interrupt check after instruction execution. It does not show a check on every clock tick.','Slide 16 · Assignment 9 Q9');
add('C9-015','Interrupts','A timer interrupt can help the OS allocate execution time among programs.',null,true,'Periodic timer events allow the OS to regain control and schedule other work. The assignment calls the interval a quantum.','Slide 15 · Assignment 9 Q26');
add('C9-016','Interrupts','Higher-priority interrupts can preempt a lower-priority handler when the architecture and masking permit.',null,true,'The interrupted handler’s context must be saved. Completion can then resume the lower-priority handler before returning to the original program.','Slides 17, 24 · Assignment 9 Q32');
add('C9-017','Interrupts','If handler L is preempted by higher-priority handler H, which return order preserves context?',['H returns to L, then L returns to the program','H returns directly to a fresh program and discards L','L completes while H is paused','Both handlers restart the computer'],0,'Nested interrupt handling unwinds in reverse nesting order, restoring each saved context. Assume preemption is enabled.','Slides 17, 24 · Assignment 9 Q32');
add('C9-018','DMA','Which setup information is required for a block read into memory?',['Device location, memory start, size, and read direction','Only the memory capacity','Only the handler name','Every byte copied through the accumulator'],0,'The OS configures the controller using programmed I/O, then DMA transfers the block and completion is signaled.','Slides 25–27 · Assignment 9 Q34');
add('C9-019','DMA','DMA means the CPU does no setup and receives no completion notification.',null,false,'DMA offloads the transfer itself. CPU/OS setup and completion handling are still needed.','Slides 25–26 · Assignment 9 Q35');
add('C9-020','DMA','Which requirement prevents the CPU and a DMA controller from improperly using the same transfer resource at once?',['Arbitration or other conflict avoidance','A larger display','Disabling all address registers','Using a printer instead of memory'],0,'DMA needs a path to memory, a controller able to access memory, and a way to avoid CPU/controller conflicts.','Slide 25 · Assignment 9 Q28');
add('C9-021','DMA','A DMA read starts at byte address 4096 and transfers 512 bytes. What is the last byte address?',['4607','4608','512','4095'],0,'Addresses run from start through start + count − 1: 4096 + 512 − 1 = 4607. This assumes contiguous byte-addressed memory.','Slide 26 · derived DMA setup exercise');
add('C9-022','I/O controllers','A device controller can buffer data and manage device-specific control while the CPU does other work.',null,true,'Buffering adapts speeds, and controller hardware handles device details. Processor-based controllers can offload more work.','Slides 28–30');
add('C9-023','Buses','Which describes full-duplex communication?',['Both directions at once','One direction only','Both directions but one at a time','Exactly four data lines'],0,'Full duplex permits simultaneous bidirectional transfer. Half duplex alternates directions; simplex has one direction.','Slide 33 · Assignment 9 Q20');
add('C9-024','Buses','A half-duplex link permits simultaneous transmission in both directions.',null,false,'Half duplex allows both directions at different times. Simultaneous bidirectional communication is full duplex.','Slide 33');
add('C9-025','Buses','Which signals can a bus carry besides data?',['Addresses and control, and sometimes power','Only cooling commands','Only graphics pixels','Only CPU register names'],0,'A bus transports data, addressing, and control signals; some also provide power.','Slide 31');
add('C9-026','Buses','A serial interface must always have lower throughput than every parallel interface.',null,false,'Serial links can run fast and avoid some interference problems associated with many parallel conductors. Width alone does not determine throughput.','Slide 34');
add('C9-027','Buses','An ideal 16-bit bus performs 50 million transfers each second. Ignoring overhead, what is throughput?',['100 MB/s','50 MB/s','800 MB/s','16 MB/s'],0,'16 bits × 50 million/s = 800 million bits/s. Divide by 8 = 100 million bytes/s, or 100 decimal MB/s.','Slide 32 · derived bus throughput exercise');
add('C9-028','Buses','Which arrangement is multipoint?',['Three controllers share one communication path','One link joins exactly two endpoints','One CPU register feeds its ALU','One unconnected port'],0,'A multipoint path connects multiple attachments. A point-to-point link has two endpoints.','Slides 33–35');
add('C9-029','Hot plugging','Removing a supported device without powering down the computer is called hot plugging or hot swapping.',null,true,'The defining feature here is operating without powering down. Plug-and-play concerns configuration and is not a universal synonym.','Assignment 9 Q16, p. 4 · Chapter 11 slide 21');
add('C9-030','I/O interfaces','In a protected OS, why does an application request I/O service rather than issue privileged device-control instructions?',['The OS controls protected hardware operations','The CPU cannot address devices','All devices use the same data format','Applications cannot contain any data'],0,'The OS mediates privileged I/O control to protect the system. Controllers then perform the device-specific work.','Slides 26, 28 · Assignment 9 Q10, Q15, Q27');
add('C9-031','Interrupts','How many binary bits encode 48 distinct interrupt identifiers?',['5','6','8','48'],1,'Five bits encode only 32 values; six encode 64. The minimum is ceiling(log2 48)=6 bits.','Slides 14, 21 · derived variant of Assignment 9 Q31');
add('C9-032','I/O controllers','A network interface card is unrelated to I/O because a network is outside the computer.',null,false,'A NIC is an I/O controller that connects the computer to a network. Networks still exchange input and output data with the system.','Assignment 9 Q17 · Chapter 10 slide 48');

add('C10-009','Storage hierarchy','Which belongs to primary memory rather than peripheral storage?',['Cache and conventional main memory','DVD and tape','SSD and hard disk','USB drive and network archive'],0,'The chapter groups cache and conventional memory as primary. Storage data and code must be brought into primary memory for CPU use.','Slides 3–6 · Assignment 10 Q12, Q31');
add('C10-010','Storage hierarchy','Access time and transfer rate measure exactly the same thing.',null,false,'Access time is a delay to locate and begin reading data. Transfer rate measures data moved per unit time.','Slide 5');
add('C10-011','Flash storage','What does wear-leveling try to do?',['Spread program/erase activity across flash cells','Spin the platter at a constant speed','Convert DRAM into ROM','Duplicate every instruction'],0,'Spreading writes reduces uneven flash wear. It does not make erase/program endurance infinite.','Slides 8–10 · Assignment 10 Q2–3, Q32');
add('C10-012','Flash storage','An SSD avoids mechanical seek and rotational delays present in a magnetic disk.',null,true,'An SSD uses electronic storage rather than a moving head over spinning platters. It still has controller and media access costs.','Slides 10–17');
add('C10-013','Magnetic disks','A cylinder consists of which locations?',['The corresponding track across recording surfaces','All sectors on one track only','One flash page','The cache tags for a disk'],0,'A cylinder groups the same radial track position across surfaces; it is not a single sector.','Slides 11–12');
add('C10-014','Disk layouts','What changes between zones in zone bit recording?',['Sectors per track','The binary base','Number of CPU registers','Whether bits need storage'],0,'Tracks in one zone have the same sector count, while zones can differ. This uses outer-track capacity more effectively.','Slides 14–15');
add('C10-015','Disk layouts','ZBR requires every track on the entire disk to have the same number of sectors.',null,false,'Sector count is constant within a zone, not necessarily across all zones.','Slide 14');
add('C10-016','Magnetic disks','At 7200 RPM, what is average rotational latency assuming a uniformly random sector position?',['4.17 ms','8.33 ms','16.67 ms','120 ms'],0,'7200/60 = 120 rotations/s. One rotation takes 8.333 ms, so average wait is half a turn, about 4.17 ms.','Slide 17 · Assignment 10 Q24, p. 6; independently derived');
add('C10-017','Magnetic disks','A disk rotates at 100 revolutions/s with 200 sectors/track. Ignoring gaps, how long does one sector transfer take?',['50 μs','100 μs','5 ms','10 ms'],0,'One revolution takes 1/100 s. Divide by 200 sectors: 1/(100×200) s = 0.00005 s = 50 μs.','Slide 17 · Assignment 10 Q25, p. 6; independently derived');
add('C10-018','Magnetic disks','Average seek is 6 ms, rotational latency 4 ms, and transfer 0.5 ms. Ignoring other overhead, what is access time?',['2.5 ms','6 ms','10 ms','10.5 ms'],3,'Add the independent delay components: 6 + 4 + 0.5 = 10.5 ms.','Slides 16–17');
add('C10-019','Magnetic disks','A drive has 120,000 tracks per surface, 4,000 sectors per track, 4 surfaces and 512 bytes per sector. What is capacity in decimal GB?',['916 GB','245.76 GB','983.04 GB','3932.16 GB'],2,'120,000×4,000×4×512 = 983,040,000,000 bytes. Divide by 10^9 for 983.04 GB. Dividing by 2^30 gives about 915.53 GiB, a different unit.','Assignment 10 Q33, p. 8 · independently derived; GB/GiB ambiguity resolved');
add('C10-020','RAID','Which RAID level combines striping with no redundancy?',['RAID 0','RAID 1','RAID 5','RAID 6'],0,'RAID 0 distributes blocks for performance but cannot reconstruct a missing member. RAID 1 mirrors; 5 and 6 include parity.','Slide 23');
add('C10-021','RAID','Two 2 TB drives in a simple RAID 1 mirror provide 4 TB of distinct usable data.',null,false,'Both copies contain the same data. Usable distinct capacity is 2 TB before overhead, not 4 TB.','Slide 20 · derived mirrored-capacity exercise');
add('C10-022','RAID','What distinguishes RAID 6 from RAID 5 in the chapter?',['Two parity checks instead of one','No redundancy','Only one disk is allowed','All data exists on a single mirrored disk'],0,'RAID 6 includes two parity checks and needs at least four drives. RAID 5 uses striped data with parity.','Slide 23');
add('C10-023','RAID','In a mirrored write, the controller writes the same data to each mirror copy.',null,true,'Identical copies provide redundancy. Parallel read gains depend on independent blocks and controller scheduling.','Slide 20 · Assignment 10 Q34');
add('C10-024','Optical storage','A CD-ROM sector in the chapter contains 2352 total bytes and 2048 data bytes. How many bytes are overhead?',['16','288','304','4400'],2,'2352 − 2048 = 304 bytes: 16 header bytes plus 288 error-control bytes in the given format.','Slide 24 · independently derived');
add('C10-025','Optical storage','A shorter laser wavelength can help an optical format store information more densely.',null,true,'The chapter contrasts DVD with CD using shorter wavelength technology. Media layout and layer count also affect capacity.','Slides 24–27');
add('C10-026','Magnetic tape','Which workload best matches tape?',['Offline archival and disaster-recovery backups','Random per-instruction register access','CPU L1 caching','An instruction pointer'],0,'Tape is suited to sequential storage and archival use. It is poorly suited to frequent random access compared with direct-access devices.','Slides 7, 28 · Assignment 10 Q18, Q27');
add('C10-027','Displays','An uncompressed 100×50 image uses 4 bits per pixel, with no padding. How many bytes are needed?',['2500','5000','20000','40000'],0,'100×50×4 = 20,000 bits. Divide by 8 for 2500 bytes. This excludes headers, compression, and row padding.','Slide 30 · independently derived');
add('C10-028','Displays','How many colors can 8-bit red, 8-bit green, and 8-bit blue represent?',['256','768','65,536','16,777,216'],3,'Each channel has 256 intensities. 256^3 = 2^24 = 16,777,216 colors, ignoring alpha.','Slide 29');
add('C10-029','Displays','Changing a screen’s aspect ratio from 4:3 to 16:9 makes it relatively wider.',null,true,'Aspect ratio compares horizontal to vertical size. 16/9 is greater than 4/3. It does not specify pixel count by itself.','Slides 29–30 · Assignment 10 Q7, Q19');
add('C10-030','Displays','What distinguishes an active-matrix LCD in the course model?',['A transistor per cell','One transistor for the whole display','Every pixel emits light without a backlight','It stores data on a magnetic drum'],0,'Active-matrix cells have their own switching transistors. The chapter contrasts this with passive row/column scanning.','Slides 36–38 · Assignment 10 Q35');
add('C10-031','Displays','A typical transmissive LCD produces its image by controlling light from a backlight.',null,true,'Liquid-crystal cells and filters control transmitted light. OLED instead emits light at the pixels.','Slides 36–39');
add('C10-032','Graphics processing','Why use a GPU for many graphics operations?',['Large amounts of parallel work can be distributed across execution resources','It eliminates all CPU instructions','It stores images only on tape','It removes the need for display pixels'],0,'GPUs exploit parallelism for graphics processing. OpenGL and DirectX provide graphics operation interfaces in the chapter.','Slides 33–35 · Assignment 10 Q28');
add('C10-033','Printers','Which laser-printer stage permanently bonds toner to paper?',['Fusing with heat','Optical scanning of a barcode','Rotating the disk','Ink-cartridge traversal'],0,'The fuser heats and melts toner onto paper after transfer from the drum. Inkjet uses droplets instead of toner.','Slides 40, 42–44 · Assignment 10 Q29');
add('C10-034','Printers','Inkjet and laser printers both form the page by extruding plastic layers.',null,false,'Inkjet deposits ink droplets and laser printing transfers and fuses toner. Extrusion of material describes a common 3D printing process.','Slides 40, 45');
add('C10-035','Input devices','How does a QR code differ from a one-dimensional barcode?',['It encodes across two dimensions and can carry more data','It is necessarily a magnetic stripe','It requires a mechanical disk head','It encodes no information'],0,'QR codes use a two-dimensional pattern read optically, often by a camera. One-dimensional barcodes use bars and spaces along one dimension.','Slide 46 · Assignment 10 Q36');
add('C10-036','Input devices','RFID requires optical line-of-sight scanning of printed bars.',null,false,'RFID uses radio-frequency identification. Optical barcodes use visible patterns; these are different input technologies.','Slide 46 · Assignment 10 Q20');
add('C10-037','Network devices','A NIC supplies network I/O, while MAC protocols specify local-medium communication rules.',null,true,'The network interface card connects the system to network communication. Medium access control governs local communication behavior.','Slide 48 · Assignment 10 Q30');
add('C10-038','Magnetic disks','Disk formatting establishes structures such as blocks and headers needed to organize stored data.',null,true,'Formatting lays out information structures for storage access. It does not increase the number of physical recording surfaces.','Slide 18');

add('C11-009','System architecture','Which set names the chapter’s basic system interface participants?',['CPU, memory, peripherals, controllers, buses','CPU, fonts, colors, margins, headings','ALU, toner, paper, drum, fuser','Cache tags, only'],0,'A system connects processing, memory, devices, and I/O control through buses. Different systems arrange these roles differently.','Slides 3–13');
add('C11-010','System architecture','A motherboard is a printed circuit board carrying the CPU and related system components.',null,true,'The physical board and its wiring provide connections among mounted components and expansion interfaces.','Slides 8–11 · Assignment 11 Q20');
add('C11-011','System architecture','In the chapter’s bus hierarchy, which pathway connects the processor and memory subsystem?',['Memory bus','Printer cable only','USB hub chain','Optical display cable'],0,'The memory path serves CPU-memory traffic. The I/O path connects peripheral controllers to CPU and memory. The northbridge name is historical.','Slides 12–15 · Assignment 11 Q23, Q33');
add('C11-012','System architecture','Every smartphone, PC, and mainframe must use the same physical bus layout.',null,false,'They share roles such as processing, memory, and I/O but implement those roles with different components, controllers, and interconnections.','Slides 3–6');
add('C11-013','Device control','Which is software rather than a physical I/O controller?',['Device driver','Bus conductor','PCIe connector','Storage controller chip'],0,'The device driver is software controlling I/O devices. Hardware controllers and buses carry out the physical transfers.','Slide 16 · Assignment 11 Q18');
add('C11-014','PCI Express','A PCIe lane uses separate paths for sending and receiving.',null,true,'Two simplex differential line pairs provide bidirectional traffic. The width of a link counts lanes.','Slide 18 · Assignment 11 Q24');
add('C11-015','PCI Express','At the same generation and per-lane rate, an x8 link has how many times the lane capacity of x2, ignoring overhead?',['2','4','8','16'],1,'x8 contains eight lanes and x2 contains two. 8/2 = 4. Actual throughput also depends on generation, negotiation, and protocol overhead.','Slide 18 · derived PCIe-width exercise');
add('C11-016','PCI Express','PCIe carries an entire multi-bit word simultaneously across shared parallel data wires.',null,false,'PCIe uses serial point-to-point lanes. Earlier PCI used a shared parallel design.','Slide 18 · Assignment 11 Q3, Q31');
add('C11-017','PCI Express','One lane can carry 1 GB/s each direction. What is an x4 link’s one-direction rate, ignoring overhead?',['1 GB/s','2 GB/s','4 GB/s','8 GB/s'],2,'Four lanes × 1 GB/s per lane = 4 GB/s in one direction. Adding both directions would describe a different aggregate measure.','Slide 18 · derived calculation, hypothetical lane rate');
add('C11-018','USB','A USB hub replaces the CPU and executes the application instruction stream.',null,false,'A hub expands device connectivity in a host-centered hierarchy. It is not the application processor.','Slide 19');
add('C11-019','USB','What role does a USB hub serve?',['Additional downstream device connection points','A replacement for main memory','A cache-coherence instruction','A magnetic recording surface'],0,'Hubs connect more devices into the USB hierarchy, sharing their upstream path to the host.','Slide 19 · Assignment 11 Q4, Q11');
add('C11-020','USB','The chapter’s USB 1–3 description gives a device limit of which value?',['16','32','127','512'],2,'Slide 19 gives 127 devices. This is a course-model limit, not a statement that a single hub has 127 physical ports.','Slide 19');
add('C11-021','USB','An isochronous transfer is scheduled for regular time intervals.',null,true,'Isochronous service supports time-sensitive delivery such as media streams. Regular scheduling is distinct from simply having a high peak bit rate.','Slide 21 · Assignment 11 Q28');
add('C11-022','Thunderbolt and USB4','Which feature does slide 21 associate with USB4?',['Support for hubs and daisy-chaining','A requirement to power off before connecting','Parallel-only transfer','No packet protocol'],0,'The chapter describes USB4 with Thunderbolt integration, hubs, daisy-chaining, and adding/removing supported devices while powered.','Slide 21');
add('C11-023','Thunderbolt and USB4','The Thunderbolt example on slide 20 describes support for six daisy-chained devices.',null,true,'This is the historical example in the deck. It should not be read as a current specification for every Thunderbolt generation.','Slide 20');
add('C11-024','Thunderbolt and USB4','Why can a high peak transfer rate alone fail to meet a live media stream’s needs?',['Delivery timing also matters','Pixels cannot be sent as data','All serial links are one-way','A hub always erases timing data'],0,'A stream needs data on a usable schedule. Isochronous service addresses regular delivery intervals as described in the chapter.','Slides 20–21');
add('C11-025','I/O channels','A mainframe channel subsystem can execute its own I/O program independently of the main CPU.',null,true,'A separate I/O processor runs channel control words and manages transfers using DMA.','Slides 22–23 · Assignment 11 Q15, Q19, Q30');
add('C11-026','I/O channels','Which best compares a channel subsystem with a simple CPU-directed transfer?',['The channel executes I/O control work that otherwise burdens the CPU','The channel eliminates memory','The CPU must copy each byte for the channel','The channel only handles graphics colors'],0,'The channel offloads I/O processing and coordinates device-memory transfers. CPU setup and completion still participate in the system.','Slides 22–23');
add('C11-027','I/O channels','Channel control words are the ordinary arithmetic instructions of the application CPU.',null,false,'They belong to the I/O channel program. The main CPU instruction stream and channel-control program serve different roles.','Slide 22');
add('C11-028','Device control','Which group consists of interface buses named on slide 16?',['PCIe, USB, SCSI, SATA','MAR, MDR, IR, PC','SRAM, DRAM, ROM, flash','RAID 0, RAID 1, RAID 5, RAID 6'],0,'The first group names interconnect/interface technologies. The other groups are registers, memories, and storage-array organizations.','Slide 16 · Assignment 11 Q35');
add('C11-029','System architecture','A fast CPU alone guarantees a fast system regardless of memory and I/O bottlenecks.',null,false,'The system must move instructions and data through memory and I/O paths. The bus hierarchy and controller design affect performance too.','Slides 11–16');
add('C11-030','USB','Using the historical 10 Gb/s rate on slide 19, what is the ideal byte rate before overhead?',['1.25 GB/s','10 GB/s','80 GB/s','0.125 GB/s'],0,'10 billion bits/s divided by 8 = 1.25 billion bytes/s, or 1.25 decimal GB/s. This is a course-example rate and ignores overhead.','Slide 19 · derived unit conversion');
add('C11-031','I/O channels','A subchannel connects through channel paths to a control unit module in the chapter’s mainframe model.',null,true,'The subsystem organizes I/O through subchannels and paths. The diagram and slide 22 distinguish these roles from the main CPU.','Slides 22–23');
add('C11-032','System architecture','Which principle guides choosing separate high-speed and peripheral connections?',['Match the path to bandwidth and latency needs','Give every device an identical bus regardless of need','Remove all controllers','Make every port the same physical width'],0,'A bus hierarchy accommodates differing device demands. Separating paths prevents the slowest peripheral from dictating every system connection.','Slides 13–16');
add('C11-033','System architecture','In the supplied Haswell diagram, which component lies between the system agent and main memory?',['Integrated memory controller','USB hub','Optical drive','Laser printer controller'],0,'The diagram connects the system agent to the integrated memory controller and then to memory. This differs from treating a separate northbridge chip as universal.','Slide 14, inspected architecture diagram');
add('C11-034','System architecture','The supplied Haswell diagram uses a ring bus to connect CPU cores, cache resources, GPU(s), and the system agent.',null,true,'These components attach around the ring in the example. It is a particular architecture drawing, not a requirement for all CPUs.','Slide 14, inspected architecture diagram');
add('C11-035','Device control','In the generalized bus diagram, which peripheral pair connects to the disk controller over SATA?',['DVD and hard disk','Keyboard and mouse only','CPU cache and registers','Display and GPU'],0,'The diagram shows SATA buses connecting the disk controller to a DVD and a hard disk. USB ports use a different controller branch.','Slide 13, inspected diagram · Assignment 11 Q27');
add('C11-036','System architecture','The basic CPU-memory-I/O drawing shows a path between an I/O module and memory without requiring device data to pass through an application register.',null,true,'The I/O module is connected to memory as well as the CPU. Together with DMA control, such a path enables device-memory block transfers.','Slide 12, inspected pathway diagram · Chapter 9 slides 25–27');
add('C11-037','I/O channels','Which order follows the device side of the channel architecture drawing?',['Channel subsystem, channel path, control unit, device','CPU register, toner drum, device','Memory, optical pit, USB host','Device, cache tag, accumulator'],0,'The diagram connects the channel subsystem through channel paths to control units, which connect to devices.','Slide 23, inspected architecture diagram');

 'C7-003':{choices:['512 bytes','1 KiB','2 KiB','4 KiB'],explanation:'A 12-bit address selects 2^12=4096 locations. At one byte per location this is 4096 bytes, or 4096/1024=4 KiB. Using 2^(12−1) would count only half the addresses; multiplying the address width by a byte size is not an address-space calculation.'},

 'C8-030':{choices:['Several processing cores share one integrated circuit','One core executes several hardware threads but remains a single core','Several independent CPU packages occupy separate motherboard sockets','One execution unit performs every operation sequentially'],explanation:'Multicore puts multiple processing cores on one chip. Multiple packages can also form a multiprocessor system, while hardware multithreading can share a core. More cores help when work and shared resources permit useful parallelism.'},

 'C9-025':{choices:['Addresses and control, and sometimes power','Data only, with no device-selection or control information','Only power, while software transports data without signals','Addresses only, because data values never travel on a bus'],explanation:'A bus can carry addressing to select a location or device, control to coordinate operations, and sometimes power, in addition to data. The signals may use dedicated lines or share physical paths according to the bus protocol.'},
 'C9-028':{choices:['Three controllers share one communication path','Each controller has its own separate link to a central switch','One dedicated link joins exactly two controllers','Two unconnected controllers each have a private internal bus'],explanation:'A multipoint bus connects several attachments to a shared path. A switch with separate point-to-point links can also connect many devices, but each individual link still joins two endpoints. The number of devices in the system alone does not define the topology.'},
 'C10-006':{choices:['Every drive reads the same block, so duplication alone multiplies throughput','The controller reconstructs every read only from parity','Every drive must finish the complete request before data can be combined','It can read different requested blocks from different drives in parallel'],explanation:'Mirror members all contain the needed data, so the controller can assign different blocks of a multiblock request to different members and combine the results. Reading the same block repeatedly is not the reason for the throughput gain. Gains depend on the workload and controller.'},
 'C10-022':{choices:['Two parity checks instead of one','Mirrored copies instead of any parity','Striping with no recovery information','One dedicated drive holding the entire unstriped file'],explanation:'The chapter describes RAID 6 with two different parity checks, compared with RAID 5’s single-parity organization. RAID 1 mirrors and RAID 0 has no redundancy. The named level matters; striping alone does not establish fault recovery.'},
 'C11-019':{choices:['Additional downstream device connection points','An independent full-capacity host connection for every attached device','A replacement for the host’s scheduling of all USB transfers','Translation of CPU load instructions directly into main-memory data'],explanation:'A hub adds downstream ports and connects them upstream toward the host. It expands a hierarchy of device connections. Additional ports do not automatically provide independent upstream bandwidth for each device or replace the host’s role.'},
 'C11-028':{choices:['PCIe, USB, SCSI, SATA','PCIe, USB, SRAM, SATA','SCSI, DRAM, SATA, USB','PCIe, USB, SIMD, SCSI'],explanation:'PCIe, USB, SCSI, and SATA are interface buses named in the chapter. SRAM and DRAM describe memories, while SIMD describes an instruction/data execution organization. A system needs both devices and interconnects, but those terms identify different roles.'},
 'C11-016':{explanation:'The misconception is describing PCIe as the older shared parallel PCI bus. PCIe uses serial point-to-point lanes with separate sending and receiving paths. A wider link combines lanes rather than sending a whole word over one shared parallel path.'},
 'C11-002':{choices:['A shared parallel path transmitting one full data word at a time','A serial link with separate transmit and receive paths','One simplex pair shared alternately for sending and receiving','A cache-coherence channel used only between memory banks'],explanation:'One PCIe lane has independent sending and receiving paths, each using a differential pair. An x4 link combines four lanes. Width counts those lanes rather than multiplying the signaling rate of one lane by four.'},
 'C11-003':{prompt:'Several USB devices behind one hub can share the hub’s upstream connection to the host.',explanation:'A hub provides downstream connection points that lead back through an upstream host connection. It expands connectivity rather than providing a wholly independent path for each device all the way to the host. The devices can share that path’s available bandwidth.'},
 'C11-004':{choices:['The main CPU’s arithmetic opcodes','The I/O device’s cache tags','Channel control words','The CPU’s saved interrupt context'],explanation:'Channel control words form the instructions executed by a mainframe channel subsystem for I/O. The main CPU can do other processing while the channel works. Saved interrupt context preserves program state; it is not an I/O program.'},
 'C11-005':{prompt:'Once a mainframe channel starts a DMA transfer, its data goes only into CPU registers and bypasses main memory.',explanation:'The misconception is confusing I/O offload with routing every byte through CPU registers. The channel manages transfers between devices and memory using DMA. The main CPU participates in initiating and coordinating work but need not execute every byte-transfer step.'},
 'C11-006':{choices:['The northbridge serves slow ports while the southbridge exclusively fetches instructions','Both bridges provide identical direct memory paths','The northbridge stores registers while the southbridge stores instructions','The northbridge handles fast CPU/memory connections, while the southbridge handles slower peripheral connections'],explanation:'The traditional northbridge serves speed-sensitive CPU and memory paths, while the southbridge handles peripheral I/O. The supplied Haswell example integrates functions differently. These names describe a historical arrangement rather than two mandatory chips in every system.'},

 'C11-009':{choices:['CPU, memory, peripherals, controllers, buses','CPU, cache, registers, ALU, control unit only','Peripherals, ports, cables, drivers, connectors only','CPU, memory, peripherals, instruction formats, opcodes'],explanation:'The system model includes processing, memory, devices, device control, and the interconnects between them. CPU internals alone omit I/O. An interface-only list omits the processing and storage roles those interfaces must connect.'},
 'C11-011':{choices:['Memory bus','USB bus to external peripherals','SATA bus to disk drives','The printer’s device-side interface'],explanation:'The memory bus connects the processor to the memory subsystem. USB, SATA, and device-side interfaces serve other I/O paths. The traditional northbridge diagram and integrated Haswell controller implement the memory role differently.'},
 'C11-012':{explanation:'The misconception is mistaking common component roles for one identical physical layout. Smartphones, PCs, and mainframes all process, store, and move data, but their controllers and interconnections reflect different workloads. Shared roles do not require a universal bus design.'},
 'C11-013':{choices:['Device driver','Device controller','Bus interface circuit','DMA engine'],explanation:'A device driver is software that directs the device through its hardware interface. Controllers, interface circuits, and DMA engines carry out hardware roles. They cooperate with the driver but are not the software controlling those operations.'},
 'C11-018':{prompt:'Adding a USB hub gives every downstream device a separate full-bandwidth path all the way to the host.',explanation:'The misconception is treating extra ports as extra independent upstream bandwidth. Devices behind a hub share its connection to the host. The hub expands connectivity but does not multiply that upstream link’s capacity for every attached device.'},
 'C11-022':{choices:['Support for hubs and daisy-chaining','One point-to-point device with no hub support','Exclusively parallel transfers instead of packets','System shutdown before any supported device is removed'],explanation:'Slide 21 describes USB4 with hubs, daisy-chaining, packet-based transfers, and supported devices added or removed while powered. These are the deck’s architectural features, not a claim about the peak rate or connector capability of every implementation.'},
 'C11-024':{choices:['Delivery timing also matters','Peak rate guarantees equal packet arrival intervals','Serial connections cannot transmit continuous media','Larger packets guarantee every delivery deadline'],explanation:'A media stream needs data at usable times as well as adequate transfer capacity. Isochronous service schedules delivery at regular intervals. A high peak rate alone does not guarantee that data arrives before playback needs it.'},
 'C11-026':{choices:['The channel executes I/O control work that otherwise burdens the CPU','The CPU copies every transferred word again after setup','The channel replaces memory accesses with register transfers','The channel can issue a request but cannot run an I/O program'],explanation:'The channel is a separate I/O processor that runs channel control words and manages DMA. It offloads detailed control from the main CPU. It does not eliminate memory or require the CPU to repeat the entire transfer.'},

 'C11-029':{explanation:'The misconception is assuming faster computation removes every bottleneck. The CPU still needs instructions and data from memory, and applications can wait for I/O. Controllers and interconnects must provide suitable bandwidth and latency for the workload.'},
 'C11-031':{explanation:'A subchannel is part of the channel subsystem’s organization of I/O. Channel paths connect toward control units, which serve devices in the drawing. This hierarchy lets the I/O processor manage device operations separately from the application CPU’s fetch/execute stream.'},
 'C11-032':{choices:['Match the path to bandwidth and latency needs','Attach every device to the slowest shared peripheral path','Choose only from the number of physical connectors','Force memory transfers through every external controller'],explanation:'CPU-memory traffic and peripheral traffic have different bandwidth and timing demands. A hierarchy assigns suitable paths and controllers to them. Connector count alone does not determine whether a path can support a workload.'},
 'C11-033':{choices:['Integrated memory controller','Separate southbridge memory buffer','PCIe peripheral controller','External USB host controller'],explanation:'The Haswell diagram places the integrated memory controller between the system agent and memory. This concrete example shows why a separate traditional northbridge should not be assumed for every processor generation.'},
 'C11-035':{choices:['DVD and hard disk','Display and GPU','USB hub and keyboard','CPU cache and main memory'],explanation:'The generalized diagram uses SATA buses between the disk controller and the DVD/hard-disk devices. USB ports use a separate controller, and graphics follows another path. Choose the interface from the device/controller relationship rather than from the broad category peripheral.'},
 'C11-037':{choices:['Channel subsystem, channel path, control unit, device','Channel subsystem, device, control unit, channel path','Control unit, CPU accumulator, channel path, device','Device, CPU instruction register, channel subsystem, control unit'],explanation:'The device side runs from the channel subsystem along a channel path to a control unit and then to the device. CPU and memory are on the other side. An application register is not a replacement for this controller hierarchy.'},
 'C7-001':{explanation:'MAR selects a memory location; MDR carries the value read from or written to that location. For a read from address 80, MAR holds 80 while MDR receives memory[80]. Confusing the address with its contents swaps the roles of these two registers.'},
 'C7-002':{explanation:'The instruction register holds the fetched instruction while the control unit decodes it. The program counter identifies where to fetch an instruction: it supplies an address rather than holding the instruction being decoded.'},
 'C7-005':{explanation:'The misconception is treating rotation as a shift that loses an outgoing bit. A rotate wraps that bit to the other end. Rotating 10000001 left by one gives 00000011; a logical left shift drops the high bit and fills with zero, giving 00000010.'},
 'C7-007':{explanation:'A nested call must preserve the outer call’s return address while saving a newer one. Each call pushes its return address, and each return pops the most recent one. LIFO order avoids overwriting an outer return address in one fixed storage location.'},
 'C7-008':{explanation:'The misconception is confusing a copy with a destructive move. A register copy leaves the source unchanged and replaces the destination’s previous contents. If R1=9 and R2=4, copying R1 into R2 leaves both registers holding 9.'},
 'C7-010':{explanation:'This confuses registers with main memory. A register is a small fixed-width CPU storage location, measured in bits or bytes. It can hold an address, instruction, data value, or status information; participating in execution does not mean holding the entire program.'},
 'C7-012':{explanation:'Both SRAM and DRAM are volatile: neither retains data without power. The difference is retention while powered. DRAM needs periodic refresh, whereas SRAM does not; static does not mean permanent or nonvolatile.'},
 'C7-014':{explanation:'The misconception is equating working memory with persistent firmware storage. DRAM loses its contents without power. Firmware needs a nonvolatile medium such as ROM or flash to survive a power cycle, even if some code is later copied into RAM for execution.'},
 'C7-016':{choices:['Copy the next instruction address from PC into MAR','Copy IR address 80 to MAR','Copy MDR into IR a second time','Copy the current accumulator into MDR'],explanation:'The instruction is already fetched, so execution copies operand address 80 from IR into MAR. Memory[80] then reaches MDR and is copied into A. Copying PC into MAR belongs to instruction fetch, not selection of this LOAD data operand.'},
 'C7-017':{explanation:'1. Fetch from PC=20: MAR=20, then MDR and IR receive ADD 60.\n2. Select the operand: MAR=60 and MDR=memory[60]=30.\n3. Execute ADD: A=150+30=180.\n4. Advance PC to 21.\nFinal state: PC=21, MAR=60, MDR=30, IR=ADD 60, A=180. Subtracting 30 would execute the wrong operation.'},
 'C7-018':{choices:['memory[70]=42 and PC=10','A=memory[70] and PC=10','memory[9]=42 and PC=10','memory[70]=42 and PC=70'],explanation:'After STORE 70 is fetched at address 9, its address field selects MAR=70. A’s value 42 passes through MDR into memory[70]. A stays 42 and PC advances to 10. Copying memory[70] into A would describe LOAD, the opposite direction.'},
 'C7-020':{explanation:'LOAD replaces A with the fetched operand. If A=10 and memory[80]=7, LOAD 80 leaves A=7, while ADD 80 leaves A=17. The same operand address can therefore produce different results depending on the opcode.'},
 'C7-024':{explanation:'A right rotation moves the low-order 1 around to the high-order position, giving 10000000. A logical right shift of 00000001 instead produces 00000000. Rotation preserves the outgoing bit; logical shifting discards it and introduces zero.'},
 'C7-026':{explanation:'SIMD applies one operation to several data elements, such as adding brightness to multiple pixels. It describes parallelism across data. Superscalar execution instead concerns issuing multiple suitable instructions in one cycle.'},
 'C7-029':{explanation:'The misconception is assuming every operand needs an explicit address field. An implicit operand is selected by the instruction set’s rules, such as an accumulator used automatically by ADD. An explicit operand is named in the instruction.'},
 'C7-031':{explanation:'The roles are reversed. The ALU performs arithmetic and comparisons. The control unit decodes instructions, coordinates transfers, and tells the ALU which operation to perform. Faster arithmetic and faster control sequences improve different parts of execution.'},
 'C7-032':{choices:['To ensure applications use fewer register operands','To protect system resources from arbitrary application changes','To prevent all application access to its own memory','To guarantee machine-control instructions finish in one cycle'],explanation:'Privilege protects operations that could change system control or access other programs’ resources. The OS mediates these operations. Ordinary permitted loads and stores in an application’s own address space are not all privileged merely because they access memory.'},
 'C8-001':{explanation:'A pipeline overlaps the stages of different instructions. Each instruction still passes through all required stages, but once the pipeline fills, completions can occur more often. Throughput improves without necessarily shortening one instruction’s start-to-finish latency.'},
 'C8-002':{choices:['They must commit before the branch to preserve instruction order','They are kept as the next instructions regardless of the branch','They are discarded and fetching resumes on the correct path','They become the result of the branch instruction'],explanation:'A wrong prediction fetches instructions from a path the program should not take. They must be discarded before committing architectural effects, and fetching restarts on the correct path. Keeping their results simply to fill the pipeline would change program behavior.'},
 'C8-004':{explanation:'Temporal locality means reusing the same locations over time, as a loop does with its instruction bytes. Spatial locality means accessing neighboring locations, as a sequential array scan does. This scenario specifically describes repeated reuse of the same bytes.'},
 'C8-005':{explanation:'The misconception is swapping write policies. Write-through forwards each cache write to the next memory level. Write-back can retain a modified, dirty line and send it later when required, such as on eviction. Delayed propagation describes write-back.'},
 'C8-006':{choices:['Only the tag, because the missed data is already in this cache','The operand from the register file instead of memory','The following sequential block regardless of the requested address','The relevant block from the next level in the memory hierarchy'],explanation:'On a miss, this cache lacks the requested block. Its controller obtains the block containing that address from the next memory level. A tag identifies a block; retrieving only a tag would not supply the missing instruction or data bytes.'},
 'C8-007':{explanation:'The misconception is assuming performance scales perfectly with processor count. Serial work cannot use every processor, while coordination and contention consume time. A second processor can improve suitable parallel work, but a guaranteed 2× application speedup does not follow.'},
 'C8-012':{choices:['Complex external instructions into simpler internal operations','Simple internal operations into a larger external instruction set','Source-language variables directly into cache tags','Operand values into opcodes without preserving their behavior'],explanation:'The assignment’s model retains a complex external instruction set while translating instructions into simpler internal operations. This is an implementation technique that preserves program behavior. It does not convert operand data or cache tags into instructions.'},
 'C8-015':{explanation:'The misconception is equating cycles per second with completed instructions per second. A 3 GHz clock supplies 3 billion cycles each second. Instructions may require several cycles, stall, or overlap, so throughput also depends on the program and CPU organization.'},
 'C8-019':{choices:['Past outcomes stored in a branch history table','Tags identifying recently accessed data-cache blocks','Return addresses saved for nested subroutine calls','Mappings from logical to physical registers'],explanation:'A branch history table records earlier outcomes to predict a future branch direction. Cache tags identify blocks, call stacks preserve return addresses, and register mappings resolve naming conflicts. Prediction concerns likely control flow and can still be wrong.'},
 'C8-020':{explanation:'The misconception is confusing a naming conflict with a true producer-consumer dependency. Renaming can separate unrelated values that reuse a register name. It cannot supply a value before its producer computes it; a consumer still needs that actual result.'},
 'C8-021':{choices:['Wider paths transfer more bytes together; interleaving spreads accesses across banks','Wider paths overlap independent banks; interleaving increases bytes per bus transfer','Wider paths retain recent blocks; interleaving predicts branches','Both work solely by shortening the CPU clock period'],explanation:'A wider path moves more bytes in one transfer. Interleaving distributes addresses among banks so operations can overlap when banks are available. Caching retains useful blocks near the CPU; it is a third mechanism.'},
 'C8-027':{explanation:'The misconception is assuming cache levels must be identical. A hierarchy trades access speed against capacity: a small fast level can handle frequent hits while a larger level holds more blocks. Equal capacity and equal access time are not L1/L2 requirements.'},
 'C8-028':{choices:['Symmetric multiprocessing','Primary-replica','Superscalar execution within one core','Memory interleaving across banks'],explanation:'The primary CPU manages resources and assigns work to replicas. SMP instead gives processors equal access to resources and shared scheduling responsibility. Central control simplifies primary-replica operation but makes the primary a bottleneck and possible failure point.'},
 'C8-031':{explanation:'The misconception is assuming extra replica CPUs automatically replace the primary’s management role. In the chapter’s design, the primary controls scheduling and resources. Losing that primary can stop the system even while replica processors remain functional.'},
 'C8-032':{choices:['Resource contention','A true data dependency between every pair of threads','Instruction decoding in the shared disk controller','A shortage of address bits in every program counter'],explanation:'The memory bus has finite transfer capacity. More cores requesting it may spend more time waiting, so adding computation resources does not remove this shared bottleneck. Coordination overhead and serial work can further limit speedup.'}
