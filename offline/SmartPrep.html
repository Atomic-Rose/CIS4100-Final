Object.assign(revisions, {
 'C9-001':{explanation:'Polling makes the CPU repeatedly inspect device status to decide when to transfer data. Interrupt-driven I/O lets the device signal an event instead. DMA addresses a different cost: moving a large block after setup without having the CPU copy each word.'},
 'C9-003':{explanation:'The misconception is assigning the bulk copy to the CPU after DMA setup. The CPU/OS supplies the device location, memory address, direction, and length. The controller transfers the block directly to memory and typically signals completion with an interrupt. Setup does not mean copying every byte.'},
 'C9-004':{choices:['To announce that the transfer is complete','To request the block’s starting address for the first time','To have the CPU copy the transferred block again byte by byte','To request the initial transfer direction after the block arrives'],explanation:'The completion interrupt tells the OS that the block transfer has ended so it can handle status and wake or notify the requester. Address, direction, and length were supplied during setup. They are not normally first chosen after completion.'},
 'C9-007':{explanation:'The misconception is confusing a shared multipoint path with a point-to-point link. One point-to-point link has exactly two endpoints. Three devices can communicate through multiple links and a switch or through a shared multipoint bus, but are not all endpoints of one point-to-point link.'},
 'C9-008':{explanation:'The misconception is treating interrupt service as a strict first-in, first-out queue. Priorities can determine which pending request is handled first. If nesting and masking allow it, a higher-priority request can preempt a lower-priority handler, whose context is restored afterward.'},
 'C9-009':{choices:['To adapt timing, formats, and control requirements','To force the CPU to run at each device’s physical speed','To replace all data movement with interrupt signals','To eliminate buffering for devices with burst transfers'],explanation:'Devices differ in format, timing, and physical control needs. An interface or controller adapts these details and can buffer data to bridge speeds. An interrupt announces an event; it does not itself carry out every transfer or eliminate the need for adaptation.'},
 'C9-011':{choices:['Save context, run handler, restore context and resume','Run handler, save the overwritten registers, then resume','Save only the device address, run handler, restart the program','Restore program context first, run handler, then save it'],explanation:'The system saves the interrupted program’s context before the handler changes registers or control state. After servicing the event, it restores that context. Saving registers only after running the handler would preserve modified values rather than the original program state.'},
 'C9-012':{explanation:'The misconception is assuming an interrupt terminates the interrupted program. Normally it resumes, so its registers and control state must be preserved. A handler may use registers, but the system restores the program’s saved context before returning.'},
 'C9-013':{choices:['Polled interrupts','Busy-wait polling with no interrupt notification','DMA block transfer with no requester identification','Vectored dispatch supplied directly by the device'],explanation:'An interrupt first announces that some device needs service. The handler then polls devices to identify the requester. Busy-wait polling repeatedly checks readiness before an interrupt; vectored handling supplies an identifier for dispatch instead of discovering it by polling.'},
 'C9-014':{choices:['After each individual bit transfer on the bus','After an instruction executes, when enabled','Only after the current program terminates','After each internal register transfer even if interrupts are disabled'],explanation:'The chapter’s simplified cycle finishes an instruction and then checks enabled interrupts. An instruction can take several clock cycles, so this is not a check every clock tick. The prompt specifies the course model rather than claiming identical timing for every CPU.'},
 'C9-017':{choices:['H returns to L, then L returns to the program','H returns to the program and discards unfinished L','L returns to the program before H can finish','Both H and L return to the program’s initial instruction'],explanation:'With preemption enabled, H interrupts L after its context is saved. H’s completion restores L, and L’s later completion restores the original program. Returning directly from H to the program would abandon L’s unfinished work.'},
 'C9-018':{choices:['Device location, memory start, size, and read direction','Device location and size without a memory destination','Memory start and size without device location or direction','Only an interrupt vector, with the block inferred by the controller'],explanation:'The OS specifies where the device block is, where memory should receive it, how much to move, and in which direction. The controller then performs DMA. The completion interrupt reports the result; it does not replace this setup information.'},
 'C9-019':{explanation:'The misconception is equating CPU offload with no CPU participation. DMA offloads the transfer itself. The CPU/OS still sets it up, and a completion interrupt usually lets it process the result and resume the requester.'},
 'C9-020':{choices:['Arbitration or other conflict avoidance','Increasing the block length until transfers overlap','Giving CPU and controller the same address without coordination','Signaling only after conflicting writes have completed'],explanation:'The DMA controller and CPU can both need memory or a shared bus. Arbitration or another coordination method prevents incompatible simultaneous use. A completion interrupt by itself does not prevent those access conflicts.'},
 'C9-024':{explanation:'The misconception is confusing half duplex with full duplex. Half duplex supports both directions but only one at a time. Full duplex supports simultaneous traffic both ways. Simplex supports only one direction.'},
 'C9-026':{explanation:'The misconception is assuming a parallel path must always be faster because it has more wires. Interference and timing constraints can limit its rate and length. A serial connection can run at a high enough signaling rate to provide greater throughput despite transferring fewer bits together.'},
 'C9-030':{choices:['The OS controls protected hardware operations','Applications cannot access their own permitted memory','Interrupt handlers must decode every application instruction','Only DMA controllers can execute programmed I/O instructions'],explanation:'The OS mediates privileged device-control operations so applications cannot arbitrarily change protected resources. The application requests a service, and the OS and controller carry it out. Protection does not prevent normal access to an application’s permitted memory.'},
 'C9-032':{explanation:'The misconception is treating an external network as outside the I/O model. A NIC controls transmitting and receiving data. Network traffic still enters and leaves the computer through interfaces, buffers, and memory transfers.'},
 'C10-001':{explanation:'The misconception is treating persistence as unlimited endurance. Flash retains data without power, but repeated program/erase cycles wear cells. Wear-leveling spreads this activity to extend useful life; it does not remove the physical endurance limit.'},
 'C10-005':{explanation:'The misconception is assuming every RAID level provides fault recovery. RAID 0 stripes blocks for performance but stores no redundant copy or parity for reconstruction. A failed member loses part of the data. Mirrored and parity-based organizations add recovery information that RAID 0 lacks.'},
 'C10-010':{explanation:'Access time and transfer rate measure different aspects of storage. Access time is the delay to locate and begin accessing data; transfer rate is the amount moved per second. A device can transfer sequential data quickly while still taking substantial time to reach a random block.'},
 'C10-011':{choices:['Spread program/erase activity across flash cells','Write repeatedly to the fastest cell regardless of wear','Refresh flash cells periodically as DRAM does','Retain the only copy of modified data in volatile cache'],explanation:'Wear-leveling distributes program/erase operations rather than wearing out a small set of cells first. DRAM refresh solves charge retention while powered, a different issue; it does not explain finite flash write endurance.'},
 'C10-013':{choices:['The corresponding track across recording surfaces','All sectors along one track on one surface','The sectors read while the disk turns once','All tracks on one recording surface'],explanation:'A cylinder groups tracks at the same radial position across recording surfaces. A track is one circular recording path on one surface, while sectors divide tracks into storage units. A cylinder groups aligned tracks, not all tracks on a surface.'},
 'C10-014':{choices:['Sectors per track','Number of recording surfaces','Number of bits in each byte','The fixed rotational speed for each individual read'],explanation:'ZBR divides tracks into zones. Sector count stays constant within a zone but can differ between zones, letting larger outer tracks hold more sectors. This is different from the simple equal-sector-count layout across the entire disk.'},
 'C10-015':{explanation:'The misconception is extending a within-zone rule to the whole disk. ZBR keeps sector count constant inside a zone, while different zones can have different counts. Outer zones can therefore hold more sectors per track.'},
 'C10-021':{explanation:'The misconception is adding mirror capacities as though the copies held different data. A simple two-drive RAID 1 stores the same blocks on both members. Two 2 TB drives provide 2 TB of distinct capacity before overhead; the second copy supplies redundancy.'},
 'C10-026':{choices:['Offline archival and disaster-recovery backups','Frequent small random updates to an active database','Low-latency paging for an interactive application','Repeated random reads of individual executable instructions'],explanation:'Tape suits long sequential transfers and offline retention. Reaching an arbitrary location can require advancing through the medium, making tape a poor fit for frequent low-latency random accesses. Direct-access storage better serves those workloads.'},

  if(screen==='library') root.innerHTML=renderLibrary(chapters,questions,scoped,openChapter);
  if(screen==='settings') root.innerHTML=renderSettings({progress:scoped,questions,storage:storageInfo(),prefs,backups:listBackups(),archived:(progress.archivedSessions||[]).length});
  if(screen==='quiz') {
    const item=currentItem(session), q=bank.get(item.id), questionKey=`${session.id}:${session.index}:${session.followUp?.id||''}`;
    const similar=!session.mock&&!session.followUp&&item.checked&&item.pick!==q.answer?similarQuestion(q,questions,session,answeredIds()):null;
    root.innerHTML=renderQuiz(session,q,{bank,similar,fresh:questionKey!==lastQuestionKey});lastQuestionKey=questionKey;
  }
  if(screen==='results') root.innerHTML=renderResults(result,recommendation,resultLabel,{progress:scoped,chapters,questions,session:resultSession});
  if(focus==='feedback') { const f=root.querySelector('.feedback'); f?.focus({preventScroll:true}); reveal(f); }
  else if(focus==='none') {}
  else if(focus.startsWith?.('[')) { root.querySelector(focus)?.focus(); }
  else { window.scrollTo(0,0); root.querySelector('h1')?.focus({preventScroll:true}); }
  root.querySelector('details.why')?.addEventListener?.('toggle',event=>{ if(event.target.open) reveal(event.target); });

}
function show(target) { screen=target; notice.hidden=true; render(); }
function options(mock=false) {
  const length=root.querySelector(mock?'#mock-length':'#length')?.value ?? (mock?prefs.mockLength:prefs.length);
  return {size:length==='all'?questions.length:Number(length || (mock?20:10)), minutes:mock?Number(root.querySelector('#minutes')?.value ?? prefs.minutes ?? 0):0};
}
function start(pool, settings={}) {
  pool=pool.filter(isFinals);
  const session=createSession(pool,{seen:answeredIds(),...settings});
  if(!session) { say('No questions match this selection yet. Choose a different topic or complete a session first.'); return; }
  for(const item of session.items)item.flag=progress.flags.includes(item.id);
  const begin=()=>{
    // Start the optional clock when the session actually opens, after replacement confirmation.
    const duration=session.deadline===null?null:session.deadline-session.started;
    session.started=Date.now();session.deadline=duration===null?null:session.started+duration;
    session.items[0].shown=true;progress.active=session;save();show('quiz');
  };
  if(progress.active) ask('End this session and start another?','The current session will be saved in history. Questions you did not answer stay unseen on your map; they are not counted as misses.','End & start',()=>{finishSession(progress,bank,'ended early');begin();});
  else begin();
}
function showResult(sc,label,session) {
  result=sc; resultLabel=label; resultSession=session;
  recommendation=recommend(result.entries,questions,answeredIds());
  show('results');
}
function finish(reason='submitted') {
  const label=progress.active.label;
  const sc=finishSession(progress,bank,reason); save(); showResult(sc,reason==='timer expired'?`${label} · Timer expired`:label,progress.history.at(-1));
}
function submit() {
  const s=progress.active;
  if(s.followUp) endFollowUp(s,bank);
  if(s.mock) confirmCurrent(s);
  save(); const sc=score(s,bank);
  ask(s.mock?'Submit this mock?':'End this session?',`${sc.total-sc.unanswered} answered, ${sc.unanswered} unanswered (${sc.skipped} skipped). Unanswered questions are not scored as correct, and they stay unseen on your map.`,s.mock?'Submit mock':'End session',()=>finish());
}
function pick(choice) {
  if(!setDraft(progress.active,choice)) return;
  for(const button of root.querySelectorAll('[data-action="pick"]')) button.setAttribute('aria-pressed',String(Number(button.dataset.value)===choice));
  const next=root.querySelector('[data-action="next"]'); if(next) next.disabled=false;
  updateCurrentStatus();save();
}
function updateCurrentStatus() {
  const s=progress.active,item=s.items[s.index];
  const status=root.querySelector(`[data-action="goto"][data-value="${s.index}"] small`);
  if(status)status.textContent=`${item.checked?'Saved':item.skipped?'Skipped':item.draft!==null?'Selected':'Unanswered'}${item.flag?' · Flagged':''}`;
}
function step(action) {
  const s=progress.active;
  if(s.followUp) {
    const f=s.followUp;
    if(action!=='next') return;
    if(!f.checked) { if(confirmCurrent(s)) { recordItem(progress,s,f,bank);save();render('feedback'); } return; }
    endFollowUp(s,bank);save();render();say(`Back to question ${s.index+1} of ${s.items.length}.`);return;
  }
  const item=s.items[s.index];
  if(action==='previous') { navigate(s,s.index-1);save();render();return; }
  if(action==='skip') {
    if(item.checked) return;
    item.skipped=true;item.draft=null;s.draft=null;
  } else if(!s.mock&&!item.checked) {
    if(confirmCurrent(s)) { recordItem(progress,s,item,bank);save();render('feedback'); }
    return;
  } else if(s.mock) confirmCurrent(s);
  if(s.index===s.items.length-1) {save();render('none');submit();return;}
  navigate(s,s.index+1);save();render();
}
function download(text, name) {
  const blob=new Blob([text],{type:'application/json'}), url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function exportProgress() { download(JSON.stringify({version:3,...progress},null,2),'finals-progress.json'); say('Progress exported. Keep the JSON file as your backup.'); }
// Explicit replacement (import, reset, new save) never destroys an unreadable save: it is copied aside first.
function makeWritable() {
  if (canWrite) return true;
  if (storageStatus === 'unreadable') { const copy = adoptUnreadable(); if (!copy) return false; }
  else if (storageStatus === 'blocked') return false;
  canWrite = true; storageStatus = 'ok'; return true;
}
async function importProgress(file,legacy) {
  if(!file) return;
  try {
    if(file.size>12000000) throw new Error('Backup exceeds 12 MB.');
    const raw=JSON.parse(await file.text()), candidate=legacy?importLegacy(raw,bank):validateProgress(raw,bank);
    ask('Replace current progress?',`${candidate.history.length} completed sessions${candidate.active?' and a resumable session':''} will be imported. Export current progress first if you want to keep it.`,'Replace progress',()=>{
      progress=candidate;parkArchiveSession(progress,bank);
      if(!makeWritable()) say('Imported for this visit only: storage is not available, so the import is in memory.');
      save();show('library');if(canWrite)say('Progress imported.');
    });
  } catch(error) {say(`Import rejected; current progress was kept. ${error.message}`);}
}
root.addEventListener('change',event=>{
  const target=event.target;
  if(target.id==='import-progress'||target.id==='import-legacy') importProgress(target.files[0],target.id==='import-legacy');
  if(target.dataset&&'pref' in target.dataset) {
    const name={length:'length','mock-length':'mockLength',minutes:'minutes'}[target.id];
    if(name){prefs[name]=target.value==='all'?'all':Number(target.value);try{localStorage.setItem(prefsKey,JSON.stringify(prefs));}catch{}say('Default saved.');}
  }
});
function onAction(action, value, button) {
  const s=progress.active;
  switch(action) {
    case 'library':show('library');break;
    case 'settings':show('settings');break;
    case 'exit':save();show('library');break;
    case 'resume':if(isFinalsSession(progress.active,bank)){lastQuestionKey='';show('quiz');}else show('library');break;
    case 'chapter':if(chapters.some(c=>c.number===Number(value))){openChapter=openChapter===Number(value)?null:Number(value);screen='library';notice.hidden=true;render(`[data-action="chapter"][data-value="${value}"]`);}break;
    case 'chapter-practice':start(questions.filter(q=>q.chapter===Number(value)),{...options(),label:`Chapter ${value} practice`});break;
    case 'chapter-missed':start(questions.filter(q=>q.chapter===Number(value)&&progress.latest[q.id]?.status==='answered'&&!progress.latest[q.id].correct),{...options(),label:`Chapter ${value} · to review`});break;
    case 'topic':{const colon=value.indexOf(':'),chapter=Number(value.slice(0,colon)),topic=value.slice(colon+1);start(questions.filter(q=>q.chapter===chapter&&q.topic===topic),{...options(),label:`Ch ${chapter} · ${topic}`});break;}
    case 'mixed':start(finalsQuestions,{...options(),label:'Mixed practice'});break;
    case 'mock':start(finalsQuestions,{...options(true),label:'Mock test',mock:true});break;
    case 'missed':start(questions.filter(q=>progress.latest[q.id]?.status==='answered'&&!progress.latest[q.id].correct),{...options(),label:'To review'});break;
    case 'flags':start(questions.filter(q=>progress.flags.includes(q.id)),{...options(),label:'Flagged questions'});break;
    case 'retry':start(result.entries.filter(e=>e.status==='answered'&&!e.correct).map(e=>e.question),{label:'Retry missed'});break;
    case 'follow-up':start(recommendation.pool,{label:`Ch ${recommendation.chapter} · ${recommendation.topic}`,size:5});break;
    case 'concept':start(recommendation.conceptPool,{label:`Ch ${recommendation.chapter} · fresh on the idea you missed`,size:3});break;
    case 'similar':{const item=s.items[s.index],match=similarQuestion(bank.get(item.id),questions,s,answeredIds());if(match&&startFollowUp(s,match.question)){save();render();}break;}
    case 'leave-follow':endFollowUp(s,bank);save();render();break;
    case 'pick':pick(Number(value));break;
    case 'flag':{const item=s.items[s.index];item.flag=!item.flag;progress.flags=progress.flags.filter(id=>id!==item.id);if(item.flag)progress.flags.push(item.id);button.setAttribute('aria-pressed',String(item.flag));button.textContent=item.flag?'Flagged':'Flag';updateCurrentStatus();save();break;}
    case 'next-unanswered':case 'next-flagged':{
      if(s.mock)confirmCurrent(s);
      const candidates=Array.from({length:s.items.length},(_,n)=>(s.index+n+1)%s.items.length);
      const index=candidates.find(n=>action==='next-flagged'?s.items[n].flag:!s.items[n].checked);
      if(index===undefined){save();say(action==='next-flagged'?'No flagged questions.':'All questions have saved answers.');break;}
      navigate(s,index);save();render();root.querySelector('.navigator').open=true;break;
    }
    case 'goto':navigate(s,Number(value));save();render();root.querySelector('.navigator').open=true;break;
    case 'previous':case 'skip':case 'next':step(action);break;
    case 'submit':submit();break;
    case 'history':{const old=scopeProgress(progress,bank).history.find(s=>s.id===value);if(old) showResult(score(old,bank),old.label,old);break;}
    case 'export':exportProgress();break;
    case 'export-backup':{try{const text=localStorage.getItem(value);if(text){download(text,`${value.replace(/[^\w.-]/g,'_')}.json`);say('Copy exported.');}}catch{say('That copy could not be read.');}break;}
    case 'retry-storage':
      if(storageStatus==='blocked'){try{localStorage.getItem(key);say('Storage is available again. Export this visit first if you need it, then reload to load your saved progress.');}catch{say('Storage is still blocked for this page.');}}
      else{save();if(!writeFailed)say('Saved.');}
      if(screen==='settings')render('none');break;
    case 'adopt':ask('Start a new save?','The unreadable data is copied to Preserved copies first. Then progress from this visit becomes your saved progress.','Start new save',()=>{if(makeWritable()){save();say('New save started. The unreadable data is kept as a copy.');}else say('A copy of the unreadable data could not be made, so nothing was changed.');render('none');});break;
    case 'reset':ask('Reset finals progress?','This clears finals answers, sessions, and flags. Archived midterm data is kept. Export a backup first to keep your finals progress.','Reset finals',()=>{progress=resetFinalsProgress(progress,bank);makeWritable();save();show('library');say('Finals progress reset.');});break;
  }
}
root.addEventListener('click',event=>{
  const button=event.target.closest('button[data-action]');if(!button) return;
  onAction(button.dataset.action,button.dataset.value,button);
});
banner.addEventListener('click',event=>{

});
document.addEventListener('keydown',event=>{
  if(dialog.open||event.altKey||event.ctrlKey||event.metaKey||event.shiftKey||event.repeat||event.target.closest('input,select,textarea,[contenteditable]'))return;
  // Study map: arrow keys move between chapter rows, chapter actions and topic buttons.
  if(screen==='library'&&(event.key==='ArrowDown'||event.key==='ArrowUp')&&event.target.closest('[data-nav]')) {
    const items=[...root.querySelectorAll('[data-nav]')],index=items.indexOf(event.target.closest('[data-nav]'));
    const next=items[index+(event.key==='ArrowDown'?1:-1)];if(next){event.preventDefault();next.focus();}return;
  }
  if(screen!=='quiz')return;
  const s=progress.active,item=currentItem(s),q=bank.get(item.id),key=event.key.toLowerCase(),follow=!!s.followUp;
  const keys=q.type==='true-false'?'tf':'abcd',position=/^[1-4]$/.test(key)?Number(key)-1:keys.indexOf(key);
  if(position>=0&&position<item.order.length){event.preventDefault();pick(item.order[position]);}
  else if(key==='enter'&&!event.target.closest('button,summary,a')) {event.preventDefault();step('next');}
  else if(key==='s'&&!item.checked&&!follow){event.preventDefault();step('skip');}
  else if(key==='p'&&s.index>0&&!follow){event.preventDefault();step('previous');}
  else if(key==='r'&&!follow){event.preventDefault();root.querySelector('[data-action="flag"]')?.click();}
  else if(key==='w'){const why=root.querySelector('details.why');if(why){event.preventDefault();why.open=!why.open;}}
});
function tick() {
  const s=progress.active;if(!s?.deadline||!isFinalsSession(s,bank)) return;
  const remaining=Math.max(0,Math.ceil((s.deadline-Date.now())/1000));
  const timer=root.querySelector('#timer');if(timer) timer.textContent=`${Math.floor(remaining/60)}:${String(remaining%60).padStart(2,'0')} remaining`;
  if(remaining===0) {

    finish('timer expired');
  }

setInterval(tick,1000);document.addEventListener('visibilitychange',()=>{tick();if(writeFailed)save();});
window.addEventListener?.('beforeunload',event=>{if(dirty&&(!canWrite||writeFailed)){event.preventDefault();event.returnValue='';}});
// Persist migrations and recoveries right away (the original payload was copied aside by loadProgress when needed).
if(parkedArchive||loaded.migrated||storageStatus==='recovered')save();

if(loaded.migrated&&loaded.status==='ok')say('Your saved progress was updated: unanswered and skipped questions no longer count as misses. Session history is unchanged.');

return {};
})();</script></body></html>
